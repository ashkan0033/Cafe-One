name: Build Windows Installer & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Build static desktop frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          $env:CAFE_ONE_DESKTOP_BUILD = "1"
          npx next build --webpack

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CafeOne icon & native Windows executables
        shell: cmd
        run: |
          python -m pip install pillow
          call installer\build_installer.bat

      - name: Stage portable Windows release bundle
        shell: pwsh
        run: |
          $stage = "dist\CafeOne-Windows"
          New-Item -ItemType Directory -Force -Path $stage, "$stage\assets", "$stage\backend\prisma", "$stage\backend\receipts", "$stage\backend\uploads", "$stage\frontend" | Out-Null

          Copy-Item "CafeOne.exe", "CafeOne-Installer.exe", "main.py", "requirements.txt", "setup_target_pc.bat", "start_cafe_one.bat", "README.md" -Destination $stage
          Copy-Item "assets\*" -Destination "$stage\assets" -Recurse
          Copy-Item "backend\*.py", "backend\Vazirmatn-Regular.ttf", "backend\requirements.txt", "backend\.env.example" -Destination "$stage\backend"
          Copy-Item "backend\prisma\schema.prisma" -Destination "$stage\backend\prisma"
          Copy-Item "backend\receipts\.gitkeep" -Destination "$stage\backend\receipts"
          Copy-Item "backend\uploads\.gitkeep" -Destination "$stage\backend\uploads"
          Copy-Item "frontend\out" -Destination "$stage\frontend\out" -Recurse

          Compress-Archive -Path $stage -DestinationPath "dist\CafeOne-Windows-Setup.zip" -Force

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CafeOne-Windows-Setup
          path: dist/CafeOne-Windows-Setup.zip

      - name: Attach bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CafeOne-Windows-Setup.zip
          generate_release_notes: true
